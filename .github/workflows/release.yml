name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional exact x.y.z version (defaults to next version after latest GitHub Release or apps/kimi-code/package.json)'
        required: false
        type: string
      dry_run:
        description: 'Build and smoke-test all OS targets without creating or updating a GitHub Release'
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.kimi-release.outputs.should_publish }}
      version: ${{ steps.kimi-release.outputs.version }}
      tag: ${{ steps.kimi-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve Kimi Code release version and tag
        id: kimi-release
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          KIMI_EXISTING_RELEASE_TAGS="$(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          export KIMI_EXISTING_RELEASE_TAGS
          node apps/kimi-code/scripts/native/resolve-release.mjs

  native-artifacts:
    name: Native release artifact
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      version: ${{ needs.plan.outputs.version }}
      sign-macos: false
      sign-windows: false

  publish-native-assets:
    name: Publish native release assets
    needs:
      - plan
      - native-artifacts
    if: needs.plan.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json and lmscript bare executables
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"
          (cd dist-native-release && sha256sum kimi-code-* kimi-* manifest.json > SHA256SUMS)
          ls -lh dist-native-release

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber dist-native-release/*
          else
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "kimi-code $RELEASE_TAG" \
              --generate-notes \
              dist-native-release/*
          fi
